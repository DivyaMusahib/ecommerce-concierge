name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check (all modules load without error)
        env:
          DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
          GEMINI_API_KEY: "dummy-key-for-import-test"
          JWT_SECRET_KEY: "ci-test-secret-key-32-chars-min!"
        run: |
          python -c "
          import sys
          # Verify all main modules import cleanly
          from app.core.config import settings, get_llm
          from app.core.formatting import format_inr
          from app.core.request_context import RequestContext
          from app.database.db import get_conn
          from app.memory.session import redis_client
          print('All imports OK')
          print('format_inr(124990):', format_inr(124990))
          assert format_inr(124990) == 'Rs.1,24,990', 'format_inr mismatch'
          assert format_inr(9995) == 'Rs.9,995', 'format_inr small amount mismatch'
          assert format_inr(500) == 'Rs.500', 'format_inr no grouping mismatch'
          print('format_inr assertions passed')
          "

      - name: Run unit tests (if any)
        env:
          DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
          GEMINI_API_KEY: "dummy-key-for-tests"
          JWT_SECRET_KEY: "ci-test-secret-key-32-chars-min!"
        run: |
          pip install pytest pytest-asyncio
          if [ -d "tests/" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests directory found — skipping pytest"
          fi
